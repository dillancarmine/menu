<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>

  <!-- LIBRERIAS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Stylish&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Potta+One&family=Stylish&display=swap" rel="stylesheet">

  <!-- ESTILOS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>

  <div class="background">

    <section class="content-header">
      <div class="container-fluid">
        <h1 class="titulo text-center animate__animated animate__fadeInDown">Hamburguesas "YOGI"</h1>
      </div>
    </section>

    <!-- HAMBURGUESAS -->
    <section class="section fade-in">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-md-4">
            <h2 class="subtitulo">Hamburguesas</h2>
            <img src="assets/img/hamburguesa.png" alt="Hamburguesa" class="img-fluid">
          </div>
          <div class="col-md-8">
            <div class="row row-cols-1 row-cols-md-3 g-4" id="hamContainer"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- HOT DOGS -->
    <section class="section fade-in">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-sm-4">
            <h2 class="subtitulo">Hot Dogs</h2>
            <img src="assets/img/hot_dog.png" alt="Hot_Dog" class="img-fluid">
          </div>
          <div class="col-sm-8">
            <div class="row row-cols-1 row-cols-md-2 g-4" id="hdContainer"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- POSTRES -->
    <section class="section fade-in">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-sm-4">
            <h2 class="subtitulo">Postres</h2>
            <img src="assets/img/postre.png" alt="Postres" class="img-fluid">
          </div>
          <div class="col-sm-8">
            <div class="row row-cols-1 row-cols-md-2 g-4" id="posContainer"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- EXTRAS -->
    <section class="section fade-in">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-sm-4">
            <h2 class="subtitulo">Extras</h2>
            <img src="assets/img/lata.png" alt="Extras" class="img-fluid">
          </div>
          <div class="col-sm-8">
            <div class="row row-cols-1 row-cols-md-2 g-4" id="exContainer"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section fade-in">
      <div class="container-fluid">
        <a href="https://maps.app.goo.gl/6JB7k92HroHgZKpFA" target="_blank">
          <h3 class="msg">¡Recuerda venir a visitarnos! 📍</h3>
        </a>
      </div>
    </section>

  </div>

  <footer>
    <p>&copy; 2026. Hamburguesas "YOGI". Todos los derechos reservados.</p>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/datos.js"></script>

</body>

</html>
